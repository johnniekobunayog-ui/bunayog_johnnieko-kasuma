
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KASUMA - Mythical Filipino Horror Game</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: black;
            color: white;
            font-family: Georgia, serif;
            overflow: hidden;
        }

        button {
            background: transparent;
            color: white;
            border: 1px solid red;
            padding: 13px 35px;
            margin: 10px;
            cursor: pointer;
            letter-spacing: 2px;
            transition: 0.3s;
        }

        button:hover {
            background: darkred;
            box-shadow: 0 0 20px red;
        }


        #warning {
            position: relative;
            isolation: isolate;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 30px;
            background: black;
            overflow: hidden;
        }

        #warning h1 {
            color: red;
            font-size: 45px;
            margin-bottom: 25px;
            letter-spacing: 5px;
            text-shadow: 0 0 15px red;
            animation: warningGlitch 2.5s infinite;
        }

        #warning p {
            max-width: 600px;
            line-height: 1.8;
            color: #ccc;
            margin-bottom: 25px;
        }

        #warning h2 {
            color: red;
            font-size: 23px;
            margin-bottom: 20px;
        }

        #warning h1,
        #warning h2,
        #warning p,
        #warning button {
            position: relative;
            z-index: 6;
        }

    

        #warning::before {
            content: "";
            position: absolute;
            inset: 0;
            background: black;
            z-index: 5;
            pointer-events: none;
            opacity: 0;
            animation: warningBlackout 5s infinite;
        }

        @keyframes warningBlackout {
            0%, 15%, 16%, 45%, 46%, 80%, 100% {
                opacity: 0;
            }

            15.5% {
                opacity: 0.95;
            }

            45.5% {
                opacity: 1;
            }

            80.5% {
                opacity: 0.85;
            }
        }

        #warning::after {
            content: "";
            position: absolute;
            inset: 0;
            background: red;
            z-index: 4;
            pointer-events: none;
            opacity: 0;
            mix-blend-mode: screen;
            animation: warningRedFlash 7s infinite;
        }

        @keyframes warningRedFlash {
            0%, 25%, 26%, 65%, 66%, 100% {
                opacity: 0;
            }

            25.5% {
                opacity: 0.35;
            }

            65.5% {
                opacity: 0.5;
            }
        }

        /* WARNING TITLE GLITCH */

        @keyframes warningGlitch {
            0%, 85%, 100% {
                transform: translateX(0);
                text-shadow: 0 0 10px red;
            }

            86% {
                transform: translateX(-4px);
                text-shadow: 4px 0 white, -4px 0 red;
            }

            87% {
                transform: translateX(4px);
                opacity: 0.5;
            }

            88% {
                transform: translateX(0);
                opacity: 1;
            }
        }

        #intro {
            display: none;
            position: relative;
            height: 100vh;
            width: 100%;
            background: black;
            overflow: hidden;
        }

        #gameVideo {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: contain;
            z-index: 1;
        }

        .black-flash {
            position: absolute;
            inset: 0;
            background: black;
            z-index: 3;
            pointer-events: none;
            opacity: 0;
            animation: introBlack 4s infinite;
        }

        @keyframes introBlack {
            0%, 8%, 10%, 30%, 32%, 60%, 62%, 100% {
                opacity: 0;
            }

            9% {
                opacity: 0.95;
            }

            31% {
                opacity: 0.9;
            }

            61% {
                opacity: 0.8;
            }
        }

        .red-flash {
            position: absolute;
            inset: 0;
            background: red;
            z-index: 2;
            pointer-events: none;
            opacity: 0;
            mix-blend-mode: screen;
            animation: introRed 5s infinite;
        }

        @keyframes introRed {
            0%, 20%, 22%, 55%, 57%, 100% {
                opacity: 0;
            }

            21% {
                opacity: 0.35;
            }

            56% {
                opacity: 0.5;
            }
        }

        /* INTRO GLITCH LINES */

        .glitch-lines {
            position: absolute;
            inset: 0;
            z-index: 4;
            pointer-events: none;
            opacity: 0;
            background: repeating-linear-gradient(
                transparent 0px,
                transparent 3px,
                rgba(255,255,255,0.12) 4px,
                transparent 5px
            );
            animation: glitchEffect 3s infinite;
        }

        @keyframes glitchEffect {
            0%, 90%, 100% {
                opacity: 0;
                transform: translateX(0);
            }

            91% {
                opacity: 0.8;
                transform: translateX(-5px);
            }

            92% {
                opacity: 0.3;
                transform: translateX(5px);
            }

            93% {
                opacity: 0.7;
                transform: translateX(-3px);
            }

            94% {
                opacity: 0;
                transform: translateX(0);
            }
        }

        #mainMenu {
            display: none;
            height: 100vh;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: #080808;
            text-align: center;
            animation: menuAppear 2s ease;
        }

        @keyframes menuAppear {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        #mainMenu h1 {
            font-size: 65px;
            color: darkred;
            letter-spacing: 12px;
            margin-bottom: 15px;
            text-shadow: 0 0 15px red;
            animation: titleGlitch 3s infinite;
        }

        @keyframes titleGlitch {
            0%, 90%, 100% {
                transform: translateX(0);
                opacity: 1;
                text-shadow: 0 0 15px red;
            }

            91% {
                transform: translateX(-5px);
                opacity: 0.5;
            }

            92% {
                transform: translateX(5px);
                text-shadow: 4px 0 red, -4px 0 white;
            }

            93% {
                transform: translateX(0);
                opacity: 1;
            }
        }

        #mainMenu p {
            color: #aaa;
            letter-spacing: 3px;
            margin-bottom: 30px;
        }

        #mainMenu button {
            width: 220px;
        }

        /* RESPONSIVE */

        @media (max-width: 600px) {
            #warning h1 {
                font-size: 35px;
            }

            #warning h2 {
                font-size: 18px;
            }

            #mainMenu h1 {
                font-size: 45px;
                letter-spacing: 8px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            #warning::before,
            #warning::after,
            #warning h1,
            .black-flash,
            .red-flash,
            .glitch-lines,
            #mainMenu h1 {
                animation: none;
            }
        }
    </style>
</head>

<body>

    <section id="warning">

        <h1>WARNING</h1>

        <p>
            This game contains fictional horror elements
            and mature themes that may not be suitable
            for all players.
        </p>


        <button id="continueBtn">CONTINUE</button>

    </section>

    <section id="intro">

        <video id="gameVideo" playsinline preload="auto">
            <source src="assets/intro.mp4" type="video/mp4">
        </video>

        <div class="red-flash"></div>
        <div class="black-flash"></div>
        <div class="glitch-lines"></div>

    </section>

    <section id="mainMenu">

        <h1>KASUMA</h1>

        <p>Something is following you...</p>

        <button>NEW GAME</button>
        <button>LOAD GAME</button>
        <button>SETTINGS</button>
        <button>EXIT</button>

    </section>


    <audio id="backgroundMusic" loop preload="auto">
        <source src="assets/background.mp3" type="audio/mpeg">
    </audio>

    <script>

        const warning = document.getElementById("warning");
        const intro = document.getElementById("intro");
        const video = document.getElementById("gameVideo");
        const mainMenu = document.getElementById("mainMenu");
        const continueBtn = document.getElementById("continueBtn");
        const backgroundMusic = document.getElementById("backgroundMusic");

        backgroundMusic.volume = 0.35;

        continueBtn.addEventListener("click", startIntro);

        async function startIntro() {

            warning.style.display = "none";
            intro.style.display = "block";

            video.currentTime = 0;

            try {
                await backgroundMusic.play();
            } catch (error) {
                console.log("Music playback error:", error);
            }

            try {
                await video.play();
            } catch (error) {
                console.log("Video playback error:", error);
                showMainMenu();
            }

        }

        function showMainMenu() {
            intro.style.display = "none";
            mainMenu.style.display = "flex";
        }

        video.addEventListener("ended", showMainMenu);

    </script>

</body>
</html>
