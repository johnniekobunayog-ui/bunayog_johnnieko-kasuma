
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KASUMA - Mythical Filipino Horror Game</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: black;
            color: white;
            font-family: Georgia, serif;
            overflow: hidden;
        }

        button {
            background: transparent;
            color: white;
            border: 1px solid red;
            padding: 13px 35px;
            margin: 10px;
            cursor: pointer;
            letter-spacing: 2px;
            transition: 0.3s;
        }

        button:hover {
            background: darkred;
            box-shadow: 0 0 20px red;
        }

        /* WARNING SCREEN */

        #warning {
            position: relative;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 30px;
            background: black;
            overflow: hidden;
            isolation: isolate;
        }

        #warning h1 {
            color: red;
            font-size: 45px;
            margin-bottom: 25px;
            letter-spacing: 5px;
            text-shadow: 0 0 15px red;
            animation: warningGlitch 2.5s infinite;
        }

        #warning p {
            max-width: 600px;
            line-height: 1.8;
            color: #ccc;
            margin-bottom: 25px;
        }

        #warning h1,
        #warning p,
        #warning button {
            position: relative;
            z-index: 6;
        }

        /* WARNING BLACK FLICKER */

        #warning::before {
            content: "";
            position: absolute;
            inset: 0;
            background: black;
            z-index: 5;
            pointer-events: none;
            opacity: 0;
            animation: warningBlackout 5s infinite;
        }

        @keyframes warningBlackout {
            0%, 15%, 16%, 45%, 46%, 80%, 100% {
                opacity: 0;
            }

            15.5%, 80.5% {
                opacity: 0.95;
            }

            45.5% {
                opacity: 1;
            }
        }

        /* WARNING RED FLASH */

        #warning::after {
            content: "";
            position: absolute;
            inset: 0;
            background: red;
            z-index: 4;
            pointer-events: none;
            opacity: 0;
            mix-blend-mode: screen;
            animation: warningRedFlash 7s infinite;
        }

        @keyframes warningRedFlash {
            0%, 25%, 26%, 65%, 66%, 100% {
                opacity: 0;
            }

            25.5% {
                opacity: 0.35;
            }

            65.5% {
                opacity: 0.5;
            }
        }

        /* WARNING TITLE GLITCH */

        @keyframes warningGlitch {
            0%, 85%, 100% {
                transform: translateX(0);
                text-shadow: 0 0 10px red;
            }

            86% {
                transform: translateX(-4px);
                text-shadow: 4px 0 white, -4px 0 red;
            }

            87% {
                transform: translateX(4px);
                opacity: 0.5;
            }

            88% {
                transform: translateX(0);
                opacity: 1;
            }
        }

        /* RATING BADGE */

        #ratingBadge {
            display: none;
            position: fixed;
            top: 25px;
            left: 25px;
            z-index: 100;
            padding: 10px 18px;
            border: 2px solid red;
            color: white;
            background: rgba(80, 0, 0, 0.85);
            font-family: Arial, sans-serif;
            font-size: 15px;
            font-weight: bold;
            letter-spacing: 2px;
            box-shadow: 0 0 15px red;
            animation: ratingAppear 1s ease,
                       ratingGlow 2s infinite;
        }

        @keyframes ratingAppear {
            from {
                opacity: 0;
                transform: translateX(-30px);
            }

            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes ratingGlow {
            0%, 100% {
                box-shadow: 0 0 8px red;
            }

            50% {
                box-shadow: 0 0 20px red;
            }
        }

        /* INTRO VIDEO */

        #intro {
            display: none;
            position: relative;
            height: 100vh;
            width: 100%;
            background: black;
            overflow: hidden;
        }

        #gameVideo {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: contain;
            z-index: 1;
        }

        /* INTRO RED FLASH */

        .red-flash {
            position: absolute;
            inset: 0;
            background: red;
            z-index: 2;
            pointer-events: none;
            opacity: 0;
            mix-blend-mode: screen;
            animation: introRed 5s infinite;
        }

        @keyframes introRed {
            0%, 20%, 22%, 55%, 57%, 100% {
                opacity: 0;
            }

            21% {
                opacity: 0.35;
            }

            56% {
                opacity: 0.5;
            }
        }

        /* INTRO BLACK FLICKER */

        .black-flash {
            position: absolute;
            inset: 0;
            background: black;
            z-index: 3;
            pointer-events: none;
            opacity: 0;
            animation: introBlack 4s infinite;
        }

        @keyframes introBlack {
            0%, 8%, 10%, 30%, 32%, 60%, 62%, 100% {
                opacity: 0;
            }

            9% {
                opacity: 0.95;
            }

            31% {
                opacity: 0.9;
            }

            61% {
                opacity: 0.8;
            }
        }

        /* INTRO GLITCH LINES */

        .glitch-lines {
            position: absolute;
            inset: 0;
            z-index: 4;
            pointer-events: none;
            opacity: 0;
            background: repeating-linear-gradient(
                transparent 0px,
                transparent 3px,
                rgba(255,255,255,0.12) 4px,
                transparent 5px
            );
            animation: glitchEffect 3s infinite;
        }

        @keyframes glitchEffect {
            0%, 90%, 100% {
                opacity: 0;
                transform: translateX(0);
            }

            91% {
                opacity: 0.8;
                transform: translateX(-5px);
            }

            92% {
                opacity: 0.3;
                transform: translateX(5px);
            }

            93% {
                opacity: 0.7;
                transform: translateX(-3px);
            }

            94% {
                opacity: 0;
                transform: translateX(0);
            }
        }

        /* H2 SUBTITLE */

        #warningSubtitle {
            position: absolute;
            bottom: 35px;
            left: 20px;
            right: 20px;
            z-index: 6;
            color: #ccc;
            font-size: 16px;
            font-weight: normal;
            letter-spacing: 3px;
            text-align: center;
            text-shadow: 0 0 8px red;
            opacity: 0;
        }

        #warningSubtitle.show-subtitle {
            animation: subtitleAppear 1.5s ease forwards;
        }

        @keyframes subtitleAppear {
            from {
                opacity: 0;
                transform: translateY(15px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* MAIN MENU */

        #mainMenu {
            display: none;
            height: 100vh;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: #080808;
            text-align: center;
            animation: menuAppear 2s ease;
        }

        @keyframes menuAppear {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        #mainMenu h1 {
            font-size: 65px;
            color: darkred;
            letter-spacing: 12px;
            margin-bottom: 15px;
            text-shadow: 0 0 15px red;
            animation: titleGlitch 3s infinite;
        }

        @keyframes titleGlitch {
            0%, 90%, 100% {
                transform: translateX(0);
                opacity: 1;
                text-shadow: 0 0 15px red;
            }

            91% {
                transform: translateX(-5px);
                opacity: 0.5;
            }

            92% {
                transform: translateX(5px);
                text-shadow: 4px 0 red, -4px 0 white;
            }

            93% {
                transform: translateX(0);
                opacity: 1;
            }
        }

        #mainMenu p {
            color: #aaa;
            letter-spacing: 3px;
            margin-bottom: 30px;
        }

        #mainMenu button {
            width: 220px;
        }

        /* RESPONSIVE */

        @media (max-width: 600px) {
            #warning h1 {
                font-size: 35px;
            }

            #warningSubtitle {
                font-size: 13px;
                letter-spacing: 2px;
                bottom: 25px;
            }

            #mainMenu h1 {
                font-size: 45px;
                letter-spacing: 8px;
            }

            #ratingBadge {
                top: 15px;
                left: 15px;
                font-size: 12px;
            }
        }

        /* REDUCED MOTION */

        @media (prefers-reduced-motion: reduce) {
            #warning::before,
            #warning::after,
            #warning h1,
            .black-flash,
            .red-flash,
            .glitch-lines,
            #mainMenu h1,
            #ratingBadge {
                animation: none;
            }
        }

    </style>
</head>

<body>

    <!-- WARNING SCREEN -->

    <section id="warning">

        <h1 id="warningTitle">WARNING</h1>

        <p id="warningText">
            This game contains fictional horror elements
            and mature themes that may not be suitable
            for all players.
        </p>

        <button id="continueBtn">CONTINUE</button>

    </section>

    <!-- RATING BADGE -->

    <div id="ratingBadge">
        18+ RATED
    </div>

    <!-- INTRO VIDEO -->

    <section id="intro">

        <video id="gameVideo" playsinline preload="auto">
            <source src="assets/intro.mp4" type="video/mp4">
            Your browser does not support HTML video.
        </video>

        <div class="red-flash"></div>
        <div class="black-flash"></div>
        <div class="glitch-lines"></div>

        <h2 id="warningSubtitle">
            PLAYER DISCRETION IS ADVISED
        </h2>

    </section>

    <!-- MAIN MENU -->

    <section id="mainMenu">

        <h1>KASUMA</h1>

        <p>Something is following you...</p>

        <button>NEW GAME</button>
        <button>LOAD GAME</button>
        <button>SETTINGS</button>
        <button>EXIT</button>

    </section>

    <!-- BACKGROUND MUSIC -->

    <audio id="backgroundMusic" loop preload="auto">
        <source src="assets/background.mp3" type="audio/mpeg">
    </audio>

    <script>

        // ELEMENTS

        const warning = document.getElementById("warning");
        const warningTitle = document.getElementById("warningTitle");
        const warningText = document.getElementById("warningText");
        const warningSubtitle = document.getElementById("warningSubtitle");

        const intro = document.getElementById("intro");
        const video = document.getElementById("gameVideo");

        const mainMenu = document.getElementById("mainMenu");
        const continueBtn = document.getElementById("continueBtn");

        const backgroundMusic = document.getElementById("backgroundMusic");
        const ratingBadge = document.getElementById("ratingBadge");

        // SETTINGS

        backgroundMusic.volume = 0.35;

        let introStarted = false;

        // CONTINUE BUTTON

        continueBtn.addEventListener("click", () => {

            if (introStarted) return;

            introStarted = true;

            // REMOVE WARNING CONTENT IMMEDIATELY

            warningTitle.style.display = "none";
            warningText.style.display = "none";
            continueBtn.style.display = "none";

            // SHOW RATING

            ratingBadge.style.display = "block";

            // WAIT 5 SECONDS

            setTimeout(() => {

                startIntro();

            }, 5000);

        });

        // START INTRO

        async function startIntro() {

            // HIDE WARNING SCREEN COMPLETELY

            warning.style.display = "none";

            // SHOW INTRO SCREEN

            intro.style.display = "block";

            // SHOW SUBTITLE

            warningSubtitle.classList.add("show-subtitle");

            // RESET VIDEO

            video.currentTime = 0;

            // START MUSIC

            backgroundMusic.play().catch(error => {
                console.log("Music playback error:", error);
            });

            // START VIDEO

            try {

                await video.play();

            } catch (error) {

                console.log("Video playback error:", error);

                showMainMenu();

            }

        }

        // SHOW MAIN MENU AFTER VIDEO

        function showMainMenu() {

            intro.style.display = "none";

            mainMenu.style.display = "flex";

        }

        // VIDEO ENDED

        video.addEventListener("ended", showMainMenu);

    </script>

</body>
</html>
